# Public entry point for akasha-service at https://akas.ttmi.my.id
#
# Installed by deploy/install-akas.sh after the certificate exists.
# Service: 127.0.0.1:8099 (systemd user unit akasha-service.service).
# Upstream fetch: 127.0.0.1:8097 (akasha-fetch-proxy.service).

limit_req_zone $binary_remote_addr zone=akas:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name akas.ttmi.my.id;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name akas.ttmi.my.id;

    ssl_certificate     /etc/letsencrypt/live/akas.ttmi.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/akas.ttmi.my.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection        "";

    # Health checks stay available while the API is under load.
    location = /health {
        proxy_pass http://127.0.0.1:8099;
        proxy_read_timeout 20s;
    }

    # Leaderboard pages can take a moment upstream; everything else is quick.
    location / {
        limit_req zone=akas burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8099;
        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    120s;
    }
}
