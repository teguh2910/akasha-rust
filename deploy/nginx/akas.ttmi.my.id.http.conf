# Bootstrap nginx site for akas.ttmi.my.id.
#
# HTTP-only on purpose: `nginx -t` has to pass before the certificate exists,
# and a 443 block pointing at a missing fullchain.pem fails the test for the
# whole host. deploy/install-akas.sh installs this file, lets certbot issue the
# certificate, then replaces it with akas.ttmi.my.id.conf.

server {
    listen 80;
    listen [::]:80;
    server_name akas.ttmi.my.id;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8099;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
